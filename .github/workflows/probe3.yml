name: Probe3 Real API Validation

# Real API validation: run probe3.py to verify dual-region pipeline produces
# 16 items / 8 cells. Does not write HTML, does not commit, does not push.
on:
  workflow_dispatch: {}
  schedule:
    # 每周一上午 10:30（北京时间），给周末/意外积累留出重试窗口
    - cron: "30 2 * * 1"

permissions:
  contents: read

jobs:
  probe3:
    runs-on: ubuntu-latest
    # Real API: 16 descs + 50+ calls, ~15-20 minutes
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run probe3.py
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          echo "Starting probe3 real API validation..."
          python3 probe3.py 2>&1 | tee probe3_output.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "---"
          echo "probe3 exit code: $EXIT_CODE"

      - name: Upload probe3 output log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe3-output
          path: probe3_output.log
          if-no-files-found: warn

      - name: Fail if probe3 failed
        if: hashFiles('probe3_output.log') != ''
        run: |
          if grep -q "^RESULT: FAIL" probe3_output.log; then
            echo "probe3 result FAIL"
            exit 1
          fi
          echo "probe3 result PASS or no items"