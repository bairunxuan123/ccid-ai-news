name: Daily AI News Pipeline

on:
  schedule:
    # 每天北京时间 14:00 = UTC 06:00
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  daily-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run news pipeline（抓取→LLM生成→写入完整版+阉割版）
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: python news_pipeline.py

      - name: Sync index.html（完整版默认入口，海报短链）
        run: cp -f ai-chain-map.html index.html

      - name: Commit & push
        run: |
          git config user.name "daily-news-bot"
          git config user.email "daily-news-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变更（当天已写入或生成失败），跳过提交"
          else
            git commit -m "chore: 更新 $(date +%F) 产业动态"
            git push
          fi

      - name: Notify WeChat via PushPlus（推送到用户手机微信）
        if: always()
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          LATEST_DATE=$(grep -m1 -oE 'date: "2026-[0-9]{2}-[0-9]{2}"' ai-chain-map.html | sed 's/date: "//;s/"//' || echo "未知")
          TITLE="赛迪AI产业动态 · ${LATEST_DATE} 已上线"
          CONTENT="今日产业动态已更新至 ${LATEST_DATE}。<br>完整版：https://bairunxuan123.github.io/ccid-ai-news/<br>阉割版：https://bairunxuan123.github.io/ccid-ai-news/ai-chain-map-lite.html"
          if [ -n "${PUSHPLUS_TOKEN}" ]; then
            RESP=$(curl -s -X POST "https://www.pushplus.plus/send" -H "Content-Type: application/json" -d "{\"token\":\"${PUSHPLUS_TOKEN}\",\"title\":\"${TITLE}\",\"content\":\"${CONTENT}\",\"template\":\"html\"}")
            echo "PushPlus 响应: ${RESP}"
          else
            echo "PUSHPLUS_TOKEN 未配置，跳过微信通知"
          fi
